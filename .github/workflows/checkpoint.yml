name: checkpoint
# Records a USDG supply baseline on the Robinhood Chain guard. checkpoint() is open to anyone and
# the guard refuses calls less than 30 minutes apart, so this runs often and skips when too soon.
# KEEPER_KEY holds gas money only; it has no role on the guard.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint
  cancel-in-progress: false
env:
  GUARD: "0x469C46486d44eE02BB5A8d4FE341e55d13f5dF25"
  RPC: https://rpc.mainnet.chain.robinhood.com
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Checkpoint if due
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
        run: |
          set -u
          from=$(cast wallet address --private-key "$KEEPER_KEY")
          if [ "$(cast balance "$from" --rpc-url "$RPC")" = "0" ]; then
            echo "::warning::keeper wallet $from has no gas on Robinhood Chain; checkpoint skipped"; exit 0
          fi
          for i in 1 2 3; do
            if out=$(cast call "$GUARD" "checkpoint()" --from "$from" --rpc-url "$RPC" 2>&1); then
              cast send "$GUARD" "checkpoint()" --private-key "$KEEPER_KEY" --rpc-url "$RPC" --json | jq -r '"checkpointed in tx " + .transactionHash'
              exit 0
            fi
            # 0x80427f67 = CheckpointTooSoon(uint64,uint64): the last baseline is under 30 minutes old
            if echo "$out" | grep -q -e CheckpointTooSoon -e 0x80427f67; then echo "not due yet"; exit 0; fi
            echo "attempt $i failed: $out"; sleep 10
          done
          exit 1
      - name: Report guard status
        if: always()
        run: |
          echo "status (level, reasons): $(cast call "$GUARD" 'status()(uint8,uint256)' --rpc-url "$RPC" | tr '\n' ' ')"
